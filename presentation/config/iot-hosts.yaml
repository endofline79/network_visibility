# IoT and streaming hosts whose Pi-hole destinations the console may show.
# Source: Pi-hole DNS client names, UniFi client snapshots, and Kevin's
# device tags (2026-10-28).
# Scope is this list only. Phones, PCs, printers, and INFRA gear stay off it.
# The flat 192.168.5.0/24 LAN is not a scope: there is no IoT VLAN.
#
# Matching is exact client_ip, plus exact client_name for `name` and each
# `dns_names` entry. To add a host, append one item under `hosts` (id, class,
# name, dns_names, ip, mac, optional notes) and rebuild the presentation
# console. class is `iot` or `streaming`.
version: 1
hosts:
