# IoT and streaming hosts whose Pi-hole destinations the console may show.
# Source: Pi-hole DNS client names and UniFi client snapshots, 2026-10-26.
# Scope is this list only. Phones, PCs, and INFRA gear stay off it.
# The flat 192.168.5.0/24 LAN is not a scope: there is no IoT VLAN.
#
# Matching is exact client_ip, plus exact client_name for `name` and each
# `dns_names` entry. To add a host, append one item under `hosts` (id, class,
# name, dns_names, ip, mac, optional notes) and rebuild the presentation
# console. class is `iot` or `streaming`. Do not commit MYCAR until Kevin
# confirms it; it is a candidate comment at the bottom of this file.
version: 1
hosts:
  - id: roku-premiere
    class: streaming
    name: RokuPremiere
    dns_names: [RokuPremiere.occido.net]
    ip: 192.168.5.107
    mac: "d8:31:34:8a:bf:b3"
    notes: Heavy roku.com + googlevideo DNS
  - id: living-room
